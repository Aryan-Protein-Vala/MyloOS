[package]
name = "app"
version = "0.1.0"
description = "MYLO: Motion. Your Live Operator."
authors = ["MYLO Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2.4.4"
tauri-plugin-global-shortcut = "2.3.2"
image = { version = "0.25.1", features = ["jpeg", "png"] }
base64 = "0.22.1"
tokio = { version = "1.0", features = ["full"] }
enigo = { version = "0.3", features = ["serde"] }
tauri-plugin-stronghold = "2.3.2"
keyring = "3.6.3"

# ── Windows-only ────────────────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.1.26"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

# ── macOS-only ──────────────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9"
objc = "0.2"
