name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The desktop app's web layer.
  # ---------------------------------------------------------------------------
  app-web:
    name: Desktop app (web layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mylo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mylo-app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # NOTE: app/layout.tsx uses next/font/google, so this step downloads Geist
      # from fonts.googleapis.com at build time. It works on GitHub runners but
      # makes the build non-hermetic: it fails on an offline or air-gapped
      # machine. Switching to next/font/local would remove the dependency.
      - name: Static export
        run: npm run build

      - name: Assert both entry points were emitted
        run: |
          test -f out/index.html || { echo "::error::missing out/index.html"; exit 1; }
          # Without `trailingSlash: true` Next emits out/overlay.html; with it,
          # out/overlay/index.html. Tauri's asset protocol resolves either, so
          # accept both rather than pinning a config detail.
          if [ ! -f out/overlay.html ] && [ ! -f out/overlay/index.html ]; then
            echo "::error::the overlay route was not exported"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Regression test for the bug that blacked out the user's entire screen.
      #
      # The dashboard and the overlay share one root layout and therefore one
      # stylesheet, and that stylesheet paints an opaque background on `html`.
      # The overlay window is transparent, so it is only see-through because of
      # this rule in app/globals.css:
      #
      #     html:has(#mylo-overlay-root), body:has(#mylo-overlay-root) {
      #       background: transparent !important;
      #     }
      #
      # That makes transparency depend on two things that live in different
      # files and have no compile-time link: the selector surviving into the
      # emitted CSS, and the overlay page still rendering that exact id.
      # Rename the id in the TSX and nothing fails to build — the overlay just
      # turns opaque and covers the desktop. So assert both, every push.
      # -----------------------------------------------------------------------
      - name: Assert the overlay stays transparent
        run: |
          overlay_html=out/overlay.html
          [ -f "$overlay_html" ] || overlay_html=out/overlay/index.html

          if ! grep -q 'id="mylo-overlay-root"' "$overlay_html"; then
            echo "::error::$overlay_html no longer renders #mylo-overlay-root;"
            echo "::error::the :has() transparency rule in globals.css cannot match,"
            echo "::error::so the overlay window will paint opaque over the desktop."
            exit 1
          fi

          css_files=$(grep -o '/_next/static/[A-Za-z0-9._/-]*\.css' "$overlay_html" | sort -u)
          if [ -z "$css_files" ]; then
            echo "::error::the overlay loaded no stylesheet at all"
            exit 1
          fi

          if ! grep -rql 'mylo-overlay-root' $(for f in $css_files; do echo "out$f"; done); then
            echo "::error::the :has(#mylo-overlay-root) transparency rule is missing"
            echo "::error::from every stylesheet the overlay loads."
            exit 1
          fi
          echo "overlay transparency rule present in: $css_files"

  # ---------------------------------------------------------------------------
  # The Rust core, on both platforms it targets. windows-capture only builds
  # for Windows and the ScreenCaptureKit path only for macOS, so neither half
  # can be validated on the other's runner.
  # ---------------------------------------------------------------------------
  app-rust:
    name: Desktop app (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mylo-app/package-lock.json

      # tauri-build reads `frontendDist: ../out` at compile time and fails if
      # the directory does not exist, so the export has to happen before cargo
      # is allowed near this crate.
      - name: Build the frontend tauri-build expects
        working-directory: mylo-app
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mylo-app/src-tauri

      - name: Formatting
        working-directory: mylo-app/src-tauri
        # Advisory only: a formatting nit must not mask a real compile error
        # in the steps below, which are the ones that matter.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: mylo-app/src-tauri
        run: cargo clippy --all-targets

      # Includes the DoAction wire-format tests. Those pin the JSON field names
      # shared by the model prompt, the Tauri IPC boundary and ai-client.ts —
      # a mismatch there is invisible to both tsc and the compiler, and broke
      # Do Mode completely once already.
      - name: Tests
        working-directory: mylo-app/src-tauri
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # The marketing site, deployed straight from this repo.
  # ---------------------------------------------------------------------------
  site:
    name: Marketing site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mylo frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
